# The README demo's kubeconfig: one context, prod1, from kcx's demo profile
# (.github/demo-kcx-profile.toml), so the prompt shows a demo cluster, never a real
# one. Nothing here reaches a server; chezmoi ignores .github.
apiVersion: v1
kind: Config
clusters:
- name: prod1
  cluster:
    server: https://prod1.k8s.acme.example:6443
contexts:
- name: prod1
  context:
    cluster: prod1
    user: jane
current-context: prod1
users:
- name: jane
  user: {}
