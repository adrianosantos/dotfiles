<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="title desc">
  <title id="title">How the dotfiles fit together</title>
  <desc id="desc">The public core repository is applied to three kinds of machine: mac-personal, one or more Macs; wsl-work, WSL2 Ubuntu; and linux-minimal, one or more Linux hosts using the home directory only. On a work Mac or a WSL laptop, a private overlay repository links work-only fragments into native include points. One up command per machine syncs everything.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .t { font-size: 14px; font-weight: 700; }
    .d { font-size: 12.5px; fill: #475569; }
    .dm { font-size: 11.5px; fill: #475569; }
    .h { font-size: 18px; font-weight: 700; }
    .s { font-size: 13px; fill: #475569; }
    .lbl { font-size: 12px; fill: #334155; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>

  <!-- background card, so it reads on light and dark pages alike -->
  <rect x="1" y="1" width="998" height="798" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- top row: your edits, the public core, the legend -->
  <rect x="40" y="45" width="200" height="60" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="58" y="70" class="t">Your edits</text>
  <text x="58" y="92" class="d">always via <tspan class="m" fill="#334155">chezmoi edit</tspan></text>

  <line x1="240" y1="75" x2="326" y2="75" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="283" y="66" class="lbl m" text-anchor="middle">git push</text>

  <rect x="330" y="25" width="340" height="95" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="500" y="57" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#3730a3">this repo</text>
  <text x="500" y="81" text-anchor="middle" style="font-size:14px;fill:#334155">public core, source of truth</text>
  <text x="500" y="104" text-anchor="middle" class="m" style="font-size:12px;fill:#4338ca">github.com/junior/dotfiles</text>

  <rect x="722" y="22" width="250" height="122" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="738" y="44" width="14" height="14" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="762" y="56" class="d">public: this repo</text>
  <rect x="738" y="67" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="762" y="79" class="d">private: your work overlay</text>
  <line x1="736" y1="98" x2="754" y2="98" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="762" y="102" class="d">optional</text>
  <rect x="742" y="112" width="12" height="12" rx="3" fill="#ffffff" stroke="#64748b" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="738" y="116" width="12" height="12" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="762" y="127" class="d">several machines, one profile</text>

  <!-- core to the three profiles -->
  <path d="M500,120 V165 M175,165 H815" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="175" y1="165" x2="175" y2="227" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="165" x2="500" y2="241" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="815" y1="165" x2="815" y2="227" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="118" y="184" width="114" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="200" text-anchor="middle" class="lbl m">chezmoi apply</text>
  <rect x="432" y="177" width="136" height="38" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="193" text-anchor="middle" class="lbl m">chezmoi update</text>
  <text x="500" y="208" text-anchor="middle" class="lbl" style="font-size:11px;fill:#64748b">anonymous https</text>
  <rect x="732" y="177" width="166" height="38" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="815" y="193" text-anchor="middle" class="lbl" style="font-size:11px;fill:#64748b">bootstrap.sh, then</text>
  <text x="815" y="208" text-anchor="middle" class="lbl m">chezmoi init --apply</text>

  <!-- mac-personal: one or more Macs -->
  <rect x="39" y="230" width="300" height="420" rx="16" fill="#f7fdfa" stroke="#059669" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="32" y="237" width="300" height="420" rx="16" fill="#f0fbf6" stroke="#059669" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="25" y="244" width="300" height="420" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="45" y="276" class="h m" style="fill:#065f46">mac-personal</text>
  <text x="45" y="296" class="s">macOS, one or more Macs</text>
  <rect x="40" y="314" width="270" height="54" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="54" y="336" class="t">Homebrew &lt;- Brewfile</text>
  <text x="54" y="355" class="d">all CLI tools and casks</text>
  <rect x="40" y="378" width="270" height="54" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="54" y="400" class="t">mise</text>
  <text x="54" y="419" class="d">language runtimes only</text>
  <rect x="40" y="442" width="270" height="54" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="54" y="464" class="t">krew plugins</text>
  <text x="54" y="483" class="d">a declarative list via <tspan class="m" fill="#334155">run_onchange</tspan></text>
  <rect x="40" y="506" width="270" height="66" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="54" y="528" class="t">self-updating apps, pinned</text>
  <text x="54" y="546" class="d">installed, then left to update</text>
  <text x="54" y="562" class="d">themselves; <tspan class="m" fill="#334155">cask-update NAME</tspan></text>
  <rect x="40" y="582" width="270" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="54" y="604" class="t" style="fill:#92400e">native include points</text>
  <text x="54" y="622" class="dm m">mise conf.d, ~/.gitconfig.local,</text>
  <text x="54" y="638" class="dm m">ssh config.d, zsh local.d</text>

  <!-- wsl-work -->
  <rect x="350" y="244" width="300" height="420" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="370" y="276" class="h m" style="fill:#075985">wsl-work</text>
  <text x="370" y="296" class="s">WSL2 Ubuntu</text>
  <rect x="365" y="314" width="270" height="54" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="379" y="336" class="t">mise</text>
  <text x="379" y="355" class="d">languages and the full CLI toolchain</text>
  <rect x="365" y="378" width="270" height="54" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="379" y="400" class="t">apt via <tspan class="m">run_onchange</tspan></text>
  <text x="379" y="419" class="d">the few bits mise cannot install</text>
  <rect x="365" y="442" width="270" height="54" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="379" y="464" class="t">docker CLI and plugins</text>
  <text x="379" y="483" class="d">on the rootless Podman socket</text>
  <rect x="365" y="506" width="270" height="66" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="379" y="528" class="t">krew plugins</text>
  <text x="379" y="546" class="d">the same declarative list</text>
  <text x="379" y="562" class="d">as on the Macs</text>
  <rect x="365" y="582" width="270" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="379" y="604" class="t" style="fill:#92400e">native include points</text>
  <text x="379" y="622" class="dm m">mise conf.d, ~/.gitconfig.local,</text>
  <text x="379" y="638" class="dm m">ssh config.d, zsh local.d</text>

  <!-- linux-minimal: one or more Linux hosts -->
  <rect x="679" y="230" width="300" height="420" rx="16" fill="#fbfaff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="672" y="237" width="300" height="420" rx="16" fill="#f8f6ff" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="665" y="244" width="300" height="420" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="685" y="276" class="h m" style="fill:#5b21b6">linux-minimal</text>
  <text x="685" y="296" class="s">one or more Linux hosts, home dir only</text>
  <rect x="680" y="314" width="270" height="54" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="694" y="336" class="t m">bootstrap.sh</text>
  <text x="694" y="355" class="d">checksum-verified chezmoi, no root</text>
  <rect x="680" y="378" width="270" height="54" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="694" y="400" class="t">mise</text>
  <text x="694" y="419" class="d">every tool as a static binary</text>
  <rect x="680" y="442" width="270" height="54" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="694" y="464" class="t">a bigger filesystem</text>
  <text x="694" y="483" class="d">tools, caches, history and temp</text>
  <rect x="680" y="506" width="270" height="66" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="694" y="528" class="t">opt-in extras</text>
  <text x="694" y="546" class="dm m">claude, codex, opencode, devin,</text>
  <text x="694" y="562" class="dm m">krew, blesh, python</text>
  <rect x="680" y="582" width="270" height="66" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="694" y="604" class="t">bash first</text>
  <text x="694" y="622" class="d">bash, readline, tmux and vim</text>
  <text x="694" y="638" class="d">settings; no zsh, no Homebrew</text>

  <!-- bottom row: the private overlay, for a work Mac or a WSL laptop, and up -->
  <line x1="175" y1="700" x2="175" y2="651" stroke="#d97706" stroke-width="2.5" marker-end="url(#amber)"/>
  <line x1="500" y1="700" x2="500" y2="651" stroke="#d97706" stroke-width="2.5" marker-end="url(#amber)"/>
  <rect x="25" y="700" width="625" height="76" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="45" y="727" class="t" style="fill:#92400e">private overlay repo, on a work Mac or a WSL laptop</text>
  <text x="45" y="747" class="d">never public: your work identity, internal hosts, work-only tools and aliases</text>
  <text x="45" y="765" class="d">its <tspan class="m" fill="#334155">install.sh</tspan> links each fragment into the include points above</text>
  <g transform="translate(612,713)" fill="none" stroke="#d97706" stroke-width="2">
    <path d="M3,9 V6 a5,5 0 0 1 10,0 V9"/>
    <rect x="0" y="9" width="16" height="12" rx="2.5" fill="#fde68a"/>
  </g>

  <rect x="665" y="700" width="300" height="76" rx="14" fill="#1e293b" stroke="#1e293b"/>
  <text x="685" y="730" class="m" style="font-size:18px;font-weight:700;fill:#ffffff">up</text>
  <text x="716" y="729" style="font-size:12px;fill:#cbd5e1">one command, on every machine:</text>
  <text x="685" y="751" style="font-size:12px;fill:#cbd5e1">syncs the core repo, the overlay,</text>
  <text x="685" y="767" style="font-size:12px;fill:#cbd5e1">packages and plugins</text>
</svg>
