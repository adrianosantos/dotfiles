# k10s configuration. Seeded once by chezmoi (create_, so never overwritten):
# from then on k10s owns this file and rewrites it from /settings. The one
# setting that matters here: its startup update check stays off, because mise
# installs and replaces the binary (see the mise config); `k10s update`, run
# by hand, still replaces it.
update:
  disabled: true
